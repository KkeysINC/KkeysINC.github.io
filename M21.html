<!DOCTYPE html>
<html>
<head>
<style>
  /* 1. Remove default browser margins so the button can touch the absolute edges */
  body {
    margin: 0;
    padding: 0;
  }

  /* 2. Remove the extra outer spacing that was shrinking the button area */
  .button-container {
    width: 100%;
  }

  /* 3. Apply the full-width block styles directly to the button */
  .fs-button {
    display: block;            /* Forces the button to act like a block element */
    width: 100vw;              /* Sets the width to 100% of the viewport/screen width */
    box-sizing: border-box;    /* Ensures padding doesn't push the button past the screen edge */
    
    background-color: #2563eb; 
    color: white;
    padding: 16px 24px;        /* Symmetrical padding for a banner-style button */
    font-size: 16px;
    font-family: sans-serif;
    font-weight: bold;
    border: none;
    border-radius: 0;          /* Removed border radius so it sits flush against the edges */
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    transition: background 0.2s;
  }
  
  .fs-button:hover {
    background-color: #1d4ed8;
  }
</style>
</head>
<body>

<div class="button-container">
  <button class="fs-button" onclick="openFullscreen()">Play</button>
</div>

<script>
function openFullscreen() {
  var gameUrl = "https://dicestack88.github.io/files/1.21.11-wasm.html"; 
  var newTab = window.open("about:blank", "_blank");
  
  if (newTab) {
    newTab.document.write(`
      <html style="margin:0;padding:0;overflow:hidden;">
        <head><title>Home-Classroom</title></head>
        <body style="margin:0;padding:0;overflow:hidden;">
          <iframe src="${gameUrl}" style="border:none;width:100vw;height:100vh;margin:0;padding:0;"></iframe>
        </body>
      </html>
    `);
  } else {
    alert("Please allow pop-ups for this site to open the game!");
  }
}
</script>

</body>
</html>
